name: Validate Sportscenter app

on:
  push:
    branches:
      - codex/sportscenter-development
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check app features and inline JavaScript syntax
        run: python scripts/check_inline_js.py
      - name: Test safe result reconciliation
        run: python -m unittest discover -s tests -v
