<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10251e"><title>Fodboldcenter</title>
<style>
:root{color-scheme:dark;--bg:#0b1512;--panel:#14231d;--panel2:#1b3027;--line:#2b4739;--text:#f1f7f3;--muted:#a8bcb0;--green:#9fe870}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,sans-serif}
header{padding:24px max(16px,calc((100% - 1100px)/2));background:linear-gradient(120deg,#10251e,#1c3c2d);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:clamp(26px,5vw,38px)}header p{margin:6px 0 0;color:var(--muted)}
main{max-width:1100px;margin:auto;padding:18px 14px 60px}.tabs,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{margin-bottom:18px}.tabs button,.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:650}
.tabs button.active,.primary{background:var(--green)!important;color:#102016!important;border-color:var(--green)!important}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;margin:12px 0}.panel h2{margin:0 0 14px;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:13px;color:var(--muted)}
input,select{width:100%;background:#09110e;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:11px;font:inherit}
.small{font-size:13px;color:var(--muted)}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:14px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600}th:nth-child(2),td:nth-child(2){text-align:left}
.empty{padding:20px;text-align:center;color:var(--muted)}.match{display:grid;grid-template-columns:1fr 60px 60px 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.match input{padding:8px;min-width:0}.match .team{text-align:center}.match .score{max-width:60px;text-align:center}.match button{padding:8px 10px}
.stat{background:var(--panel2);padding:12px;border-radius:10px}.stat strong{font-size:24px;display:block}.notice{border-left:3px solid var(--green);padding:8px 12px;color:var(--muted);font-size:13px}
@media(max-width:520px){.match{grid-template-columns:minmax(0,1fr) 42px 42px minmax(0,1fr);gap:5px}.match button{grid-column:1/-1}.match .score{max-width:42px;padding:7px 3px}.match .team{font-size:13px;overflow-wrap:anywhere}.tabs button{flex:1;padding:9px 6px}}
</style></head><body>
<header><h1>⚽ Fodboldcenter</h1><p>Kampe · stillinger · holddata · målværdier</p></header>
<main>
<div class="tabs" id="tabs"><button data-tab="oversigt" class="active">Oversigt</button><button data-tab="kampe">Kampe & resultater</button><button data-tab="hold">Holddata</button><button data-tab="vaerdi">Over 1,5 / 2,5</button><button data-tab="backup">Backup</button></div>
<div class="row" style="margin-bottom:12px"><div class="field" style="min-width:220px;flex:1"><label for="league">Vælg liga</label><select id="league"></select></div><div class="field" style="min-width:140px"><label for="season">Sæson</label><input id="season" value="2026/27"></div></div><div id="app"></div>
</main>
<script>
const leagues=['Premier League','Championship','League One','Bundesliga','Serie A','La Liga','Superligaen','1. Division'],key='fodboldcenter-v1';
let data=load(),tab='oversigt';
function load(){try{return JSON.parse(localStorage.getItem(key))||{matches:[],teams:{}}}catch(e){return {matches:[],teams:{}}}}
function save(){localStorage.setItem(key,JSON.stringify(data))}
const $=id=>document.getElementById(id),league=()=>$('league').value||leagues[0],season=()=>$('season').value||'2026/27';
function matches(){return data.matches.filter(m=>m.league===league()&&m.season===season())}
function teams(){return [...new Set([...matches().flatMap(m=>[m.home,m.away]),...(data.teams[league()+'|'+season()]||[])].filter(Boolean))].sort((a,b)=>a.localeCompare(b,'da'))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addTeam(t){let k=league()+'|'+season();data.teams[k]=[...new Set([...(data.teams[k]||[]),t.trim()])].filter(Boolean).sort();save()}
function standings(){let out={};for(const t of teams())out[t]={team:t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,homeP:0,homeGF:0,homeGA:0,awayP:0,awayGF:0,awayGA:0};
for(const m of matches()){if(m.hg===''||m.ag===''||m.hg==null||m.ag==null)continue;let h=out[m.home],a=out[m.away];if(!h||!a)continue;let x=+m.hg,y=+m.ag;h.p++;a.p++;h.gf+=x;h.ga+=y;a.gf+=y;a.ga+=x;h.homeP++;h.homeGF+=x;h.homeGA+=y;a.awayP++;a.awayGF+=y;a.awayGA+=x;if(x>y){h.w++;h.pts+=3;a.l++}else if(x<y){a.w++;a.pts+=3;h.l++}else{h.d++;a.d++;h.pts++;a.pts++}}
return Object.values(out).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.team.localeCompare(b.team,'da'))}
function pct(n,d){return d?Math.round(n/d*100)+'%':'—'}
function table(rows){if(!rows.length)return '<div class="empty">Ingen hold eller resultater endnu. Tilføj hold og kampe under “Kampe & resultater”.</div>';return '<div class="scroll"><table><thead><tr><th>#</th><th>Hold</th><th>K</th><th>V</th><th>U</th><th>T</th><th>MF</th><th>MI</th><th>±</th><th>P</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(r.team)+'</td><td>'+r.p+'</td><td>'+r.w+'</td><td>'+r.d+'</td><td>'+r.l+'</td><td>'+r.gf+'</td><td>'+r.ga+'</td><td>'+(r.gf-r.ga)+'</td><td><b>'+r.pts+'</b></td></tr>').join('')+'</tbody></table></div>'}
function render(){$('app').innerHTML=({oversigt:overview,kampe:games,hold:holddata,vaerdi:values,backup:backups}[tab])()}
function overview(){let ms=matches(),done=ms.filter(m=>m.hg!==''&&m.ag!==''&&m.hg!=null&&m.ag!=null),rows=standings();return '<div class="grid"><div class="stat"><strong>'+ms.length+'</strong><span>Kampe oprettet</span></div><div class="stat"><strong>'+done.length+'</strong><span>Resultater indtastet</span></div><div class="stat"><strong>'+teams().length+'</strong><span>Hold i ligaen</span></div><div class="stat"><strong>'+(done.length?(done.reduce((s,m)=>s+(+m.hg + +m.ag),0)/done.length).toFixed(2):'—')+'</strong><span>Gennemsnitlige mål pr. kamp</span></div></div><section class="panel"><h2>Stilling · '+esc(league())+'</h2>'+table(rows)+'</section><div class="notice">Indtast kampresultater under “Kampe & resultater”. Stillingen og holdstatistik opdateres automatisk.</div>'}
function games(){let ms=matches().slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));return '<section class="panel"><h2>Opret kamp</h2><div class="grid"><div class="field"><label>Dato</label><input id="date" type="date"></div><div class="field"><label>Hjemmehold</label><input id="home" list="teamlist" placeholder="Fx Arsenal"></div><div class="field"><label>Udehold</label><input id="away" list="teamlist" placeholder="Fx Chelsea"></div></div><datalist id="teamlist">'+teams().map(t=>'<option value="'+esc(t)+'">').join('')+'</datalist><p><button class="btn primary" id="addmatch">Tilføj kamp</button></p><p class="small">Indtast holdnavne ens hver gang. Resultater kan ændres direkte nedenfor.</p></section><section class="panel"><h2>Kampe og resultater ('+ms.length+')</h2>'+(!ms.length?'<div class="empty">Ingen kampe endnu.</div>':ms.map(m=>'<div class="match"><div class="team">'+esc(m.home)+(m.date?'<div class="small">'+esc(m.date)+'</div>':'')+'</div><input class="score" aria-label="Hjemmemål" type="number" min="0" step="1" placeholder="–" data-id="'+m.id+'" data-side="hg" value="'+(m.hg??'')+'"><input class="score" aria-label="Udemål" type="number" min="0" step="1" placeholder="–" data-id="'+m.id+'" data-side="ag" value="'+(m.ag??'')+'"><div class="team">'+esc(m.away)+'</div><button class="btn" data-delete="'+m.id+'">Slet</button></div>').join(''))+'</section>'}
function holddata(){let rows=standings();return '<section class="panel"><h2>Holddata · '+esc(league())+'</h2>'+(!rows.length?'<div class="empty">Tilføj kampe først.</div>':'<div class="scroll"><table><thead><tr><th>Hold</th><th>K</th><th>Mål for</th><th>Mål imod</th><th>Snit scoret</th><th>Snit indkasseret</th><th>Hjemme K</th><th>Hjemme MF/MI</th><th>Ude K</th><th>Ude MF/MI</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.team)+'</td><td>'+r.p+'</td><td>'+r.gf+'</td><td>'+r.ga+'</td><td>'+(r.p?(r.gf/r.p).toFixed(2):'—')+'</td><td>'+(r.p?(r.ga/r.p).toFixed(2):'—')+'</td><td>'+r.homeP+'</td><td>'+r.homeGF+' / '+r.homeGA+'</td><td>'+r.awayP+'</td><td>'+r.awayGF+' / '+r.awayGA+'</td></tr>').join('')+'</tbody></table></div>')+'</section><section class="panel"><h2>Tilføj hold til liga</h2><div class="row"><input id="newteam" placeholder="Holdnavn" style="flex:1;min-width:180px"><button class="btn primary" id="addteam">Tilføj hold</button></div><p class="small">Hold uden kampe vises med 0 kampe.</p><div class="row">'+teams().map(t=>'<span class="stat">'+esc(t)+'</span>').join('')+'</div></section>'}
function values(){let done=matches().filter(m=>m.hg!==''&&m.ag!==''&&m.hg!=null&&m.ag!=null),o15=done.filter(m=>+m.hg + +m.ag>=2).length,o25=done.filter(m=>+m.hg + +m.ag>=3).length;return '<div class="grid"><div class="stat"><strong>'+done.length+'</strong><span>Kampe med resultat</span></div><div class="stat"><strong>'+pct(o15,done.length)+'</strong><span>Over 1,5 · '+o15+' af '+done.length+'</span></div><div class="stat"><strong>'+pct(o25,done.length)+'</strong><span>Over 2,5 · '+o25+' af '+done.length+'</span></div></div><section class="panel"><h2>Over 1,5 og Over 2,5</h2><p>Procenter beregnes ud fra kampe med slutresultat i den valgte liga og sæson.</p><div class="scroll"><table><thead><tr><th>Hold</th><th>Kampe</th><th>Over 1,5</th><th>Over 1,5 %</th><th>Over 2,5</th><th>Over 2,5 %</th></tr></thead><tbody>'+teams().map(t=>{let ms=done.filter(m=>m.home===t||m.away===t),a=ms.filter(m=>+m.hg + +m.ag>=2).length,b=ms.filter(m=>+m.hg + +m.ag>=3).length;return '<tr><td>'+esc(t)+'</td><td>'+ms.length+'</td><td>'+a+'</td><td>'+pct(a,ms.length)+'</td><td>'+b+'</td><td>'+pct(b,ms.length)+'</td></tr>'}).join('')+'</tbody></table></div></section><div class="notice">Historiske frekvenser er ikke en garanti for kommende kampe.</div>'}
function backups(){return '<section class="panel"><h2>Eksportér backup</h2><p>Download alle hold og kampe som JSON.</p><button class="btn primary" id="export">Download backup</button></section><section class="panel"><h2>Importér backup</h2><p>Import erstatter dataene i denne browser.</p><input id="importfile" type="file" accept=".json,application/json"><p><button class="btn" id="import">Importér backup</button></p></section><section class="panel"><h2>Data og synkronisering</h2><p>Data gemmes lokalt i browseren og deles ikke automatisk mellem iPhone og computer. Brug backup til at flytte data, indtil et fælles datalager er sat op.</p></section>'}
$('tabs').addEventListener('click',e=>{let b=e.target.closest('button[data-tab]');if(!b)return;tab=b.dataset.tab;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));render()});
$('league').innerHTML=leagues.map(x=>'<option>'+x+'</option>').join('');$('league').addEventListener('change',render);$('season').addEventListener('change',render);
$('app').addEventListener('click',e=>{
if(e.target.id==='addmatch'){let h=$('home').value.trim(),a=$('away').value.trim();if(!h||!a||h===a){alert('Skriv to forskellige holdnavne.');return}addTeam(h);addTeam(a);data.matches.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),league:league(),season:season(),date:$('date').value,home:h,away:a,hg:'',ag:''});save();render()}
if(e.target.id==='addteam'){let t=$('newteam').value.trim();if(t){addTeam(t);render()}}
if(e.target.dataset.delete){if(confirm('Slet denne kamp?')){data.matches=data.matches.filter(m=>m.id!==e.target.dataset.delete);save();render()}}
if(e.target.id==='export'){let blob=new Blob([JSON.stringify({format:'fodboldcenter-backup-v1',exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fodboldcenter-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url)}
if(e.target.id==='import'){let f=$('importfile').files[0];if(!f){alert('Vælg en backupfil først.');return}let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result),d=obj.data||obj;if(!Array.isArray(d.matches)||typeof d.teams!=='object')throw Error();if(!confirm('Import erstatter dine nuværende data i denne browser. Fortsæt?'))return;data=d;save();render();alert('Backup importeret.')}catch(err){alert('Filen kunne ikke læses som en Fodboldcenter-backup.')}};r.readAsText(f)}
});
$('app').addEventListener('change',e=>{let el=e.target;if(!el.dataset.id)return;let m=data.matches.find(m=>m.id===el.dataset.id);if(!m)return;let v=el.value;if(v!==''&&(!Number.isInteger(+v)||+v<0)){alert('Mål skal være et heltal på 0 eller derover.');el.value=m[el.dataset.side]??'';return}m[el.dataset.side]=v;save();render()});
render();
</script></body></html>
