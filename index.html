<style>
:root{color-scheme:dark;--bg:#0b1512;--panel:#14231d;--panel2:#1b3027;--line:#2b4739;--text:#f1f7f3;--muted:#a8bcb0;--green:#9fe870}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,sans-serif}
header{padding:24px max(16px,calc((100% - 1100px)/2));background:linear-gradient(120deg,#10251e,#1c3c2d);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:clamp(26px,5vw,38px)}header p{margin:6px 0 0;color:var(--muted)}
main{max-width:1100px;margin:auto;padding:18px 14px 60px}.tabs,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{margin-bottom:18px}.tabs button,.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:650}
.tabs button.active,.primary{background:var(--green)!important;color:#102016!important;border-color:var(--green)!important}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;margin:12px 0}.panel h2{margin:0 0 14px;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:13px;color:var(--muted)}
input,select{width:100%;background:#09110e;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:11px;font:inherit}
.small{font-size:13px;color:var(--muted)}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:14px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600}th:nth-child(2),td:nth-child(2){text-align:left}
.empty{padding:20px;text-align:center;color:var(--muted)}.match{display:grid;grid-template-columns:1fr 60px 60px 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.match input{padding:8px;min-width:0}.match .team{text-align:center}.match .score{max-width:60px;text-align:center}.match button{padding:8px 10px}
.stat{background:var(--panel2);padding:12px;border-radius:10px}.stat strong{font-size:24px;display:block}.notice{border-left:3px solid var(--green);padding:8px 12px;color:var(--muted);font-size:13px}
@media(max-width:520px){.match{grid-template-columns:minmax(0,1fr) 42px 42px minmax(0,1fr);gap:5px}.match button{grid-column:1/-1}.match .score{max-width:42px;padding:7px 3px}.match .team{font-size:13px;overflow-wrap:anywhere}.tabs button{flex:1;padding:9px 6px}}

async function pullCloudData(showConfirm=true){

        return false;
      }

      fcLastRemoteUpdatedAt=row.updated_at||null;
      fcCloudReady=true;render();
      syncStatus('Data hentet fra skyen');

function listenForCloudChanges(){

    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'fodboldcenter_data',filter:'user_id=eq.'+fcUser.id},async payload=>{
      const stamp=payload.new?.updated_at;
      if(!stamp||stamp===fcLastRemoteUpdatedAt||fcPushing||!fcCloudReady)return;
      if(fcSaveTimer){clearTimeout(fcSaveTimer);fcSaveTimer=null}
      try{
        const {data:row,error}=await fcSupabase.from('fodboldcenter_data').select('data,updated_at').eq('user_id',fcUser.id).maybeSingle();
        if(error)throw error;
        if(row?.data&&row.updated_at!==fcLastRemoteUpdatedAt){
          data=row.data;localStorage.setItem(key,JSON.stringify(data));fcLastRemoteUpdatedAt=row.updated_at;render();
          syncStatus('Opdateret fra den anden enhed · '+new Date().toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'}));
        }
      }catch(e){syncStatus('Ny data kunne ikke hentes')}
    }).subscribe();

function teamScoringChance(team,isHome,threshold,expectedGoals){
 const played=matches().filter(m=>m.hg!==''&&m.ag!==''&&m.hg!=null&&m.ag!=null&&(isHome?m.home===team:m.away===team));
 const hist=played.length?played.filter(m=>(isHome?+m.hg:+m.ag)>threshold).length/played.length:null;
 const poisson=poissonOver(expectedGoals,threshold);
 return hist==null?poisson:poisson*.7+hist*.3;
}

let model=hist==null?poisson:poisson*.7+hist*.3,fair=model>0?1/model:Infinity,oddsNum=Number(String(odds).replace(',','.')),validOdds=odds!==''&&Number.isFinite(oddsNum)&&oddsNum>1,implied=validOdds?1/oddsNum:null,ev=validOdds?model*oddsNum-1:null,diff=validOdds?model-implied:null;

const fmt=v=>v==null||!Number.isFinite(v)?'—':(v*100).toFixed(1)+'%',num=v=>v==null||!Number.isFinite(v)?'—':v.toFixed(2);
return '<div class="tabs" style="margin:0 0 12px"><button data-valuetype="15" class="'+(type==='15'?'active':'')+'">Over 1,5 værdi</button><button data-valuetype="25" class="'+(type==='25'?'active':'')+'">Over 2,5 værdi</button></div>'+
'<section class="panel"><h2>Værdiberegner · Over '+(type==='15'?'1,5':'2,5')+'</h2><p class="small">Vælg hjemmehold og udehold, og indtast bookmakerens decimalodds. Estimatet beregnes fra holdenes mål hjemme/ude og historiske Over-procenter i den valgte liga.</p><div class="grid"><div class="field"><label>Hjemmehold</label><select id="calcHome">'+opts+'</select></div><div class="field"><label>Udehold</label><select id="calcAway">'+awayOpts+'</select></div><div class="field"><label>Bookmakerodds · Over '+(type==='15'?'1,5':'2,5')+'</label><input id="calcOdds" type="number" min="1.01" step="0.01" placeholder="Fx 1,85" value="'+esc(odds)+'"></div></div></section>'+

'<section class="panel"><h2>Holdets chance for at score i denne kamp</h2><p class="small">Beregnet for den konkrete kamp ud fra forventede mål for hvert hold. Indtast bookmakerens decimalodds ved hvert marked, så beregnes fair odds, implicit chance og forventet værdi (EV) særskilt for hvert hold.</p><div class="grid"><div class="stat"><strong>'+fmt(teamScoringChance(home,true,1,eh))+'</strong><span>'+esc(home)+' · Over 1,5 holdmål (2+ mål)</span></div><div class="stat"><strong>'+fmt(teamScoringChance(home,true,2,eh))+'</strong><span>'+esc(home)+' · Over 2,5 holdmål (3+ mål)</span></div><div class="stat"><strong>'+fmt(teamScoringChance(away,false,1,ea))+'</strong><span>'+esc(away)+' · Over 1,5 holdmål (2+ mål)</span></div><div class="stat"><strong>'+fmt(teamScoringChance(away,false,2,ea))+'</strong><span>'+esc(away)+' · Over 2,5 holdmål (3+ mål)</span></div></div><p class="small">Det er sandsynligheder for det enkelte holds mål — ikke for kampens samlede mål. Hvis der mangler historik, bruges Poisson-estimatet alene.</p><h3 style="margin:18px 0 8px">Bookmakerodds og værdi · holdmål</h3><div class="grid">'+[['h15',home,1,eh,true],['h25',home,2,eh,true],['a15',away,1,ea,false],['a25',away,2,ea,false]].map(([key,team,threshold,expected,isHome])=>{const chance=teamScoringChance(team,isHome,threshold,expected),val=(window.fcTeamOdds||{})[key]||'',od=Number(String(val).replace(',','.')),valid=val!==''&&Number.isFinite(od)&&od>1,ev=valid?chance*od-1:null,fair=chance>0?1/chance:null;return '<div class="panel" style="margin:0;padding:12px"><b>'+esc(team)+' · Over '+(threshold===1?'1,5':'2,5')+'</b><div class="field" style="margin-top:8px"><label>Bookmakerodds (decimal)</label><input id="teamOdds_'+key+'" type="number" min="1.01" step="0.01" placeholder="Fx 2,10" value="'+esc(val)+'"></div><div class="grid" style="margin-top:8px;grid-template-columns:repeat(auto-fit,minmax(100px,1fr))"><div><div class="small">Fair odds</div><b>'+num(fair)+'</b></div><div><div class="small">Implicit chance</div><b>'+fmt(valid?1/od:null)+'</b></div><div><div class="small">EV</div><b style="color:'+(ev!=null&&ev>0?'var(--green)':'var(--text)')+'">'+fmt(ev)+'</b></div></div></div>';}).join('')+'</div><p class="small">EV beregnes som modelchance × bookmakerodds − 1. Positiv EV betyder, at oddsene er højere end modellens fair odds; det er stadig kun et estimat.</p></section>'+
'<section class="panel"><h2>Sandsynlighed og værdi</h2><div class="grid"><div class="stat"><strong>'+fmt(poisson)+'</strong><span>Poisson-chance for Over '+(type==='15'?'1,5':'2,5')+'</span></div><div class="stat"><strong>'+fmt(hist)+'</strong><span>Historisk Over-procent · gennemsnit af hold</span></div><div class="stat"><strong>'+fmt(model)+'</strong><span>Samlet modelchance (70 % Poisson / 30 % historik'+(hist==null?' · historik mangler, Poisson bruges':'')+')</span></div><div class="stat"><strong>'+num(fair)+'</strong><span>Fair odds ud fra modelchance</span></div><div class="stat"><strong>'+fmt(implied)+'</strong><span>Bookmakerens implicitte chance</span></div><div class="stat"><strong>'+fmt(ev)+'</strong><span>Forventet afkast (EV)</span></div><div class="stat"><strong>'+fmt(diff)+'</strong><span>Værdi i procentpoint</span></div></div><p><b>'+verdict+'</b></p></section>'+
